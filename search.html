<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- links -->
  <link rel="icon" type="png" href="img/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/new-style.css" />
  <!-- Title -->
  <title>Search City | Weather App</title>
</head>

<body>
  <div class="dashboard-container">
    <!-- Navigation -->
    <nav>
      <ul>
        <li><a href="index.html"><i class="fa-solid fa-location-arrow"></i></a></li>
        <li><a class="active" href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a></li>
        <li><a href="world.html"><i class="fa-solid fa-earth-americas"></i></a></li>
      </ul>
    </nav>
    <!-- Search Section -->
    <h3>Search for a City</h3>
    <div class="search">
      <div class="search-icon"><i class="fa-solid fa-location-dot"></i></div>
      <input class="searchinput" type="text" placeholder="Enter city name...">
    </div>
    <div class="message">You can search by city, state, or country name.</div>
    <div class="error-message" style="display:none;">City not found. Please try again.</div>
    <!-- Weather Result Card -->
    <div class="return" style="display:none;">
      <div class="current-weather-card">
        <div class="weather-main-info">
          <div class="weather-icon"><img class="weather-img" src="img/sun.png" alt="Weather Icon"></div>
          <div class="temperature weather-temp">--°</div>
        </div>
        <div class="weather-description city-name">--</div>
        <div class="weather-details">
          <span>Wind: <span class="wind">--</span></span>
          <span>Pressure: <span class="pressure">--</span></span>
          <span>Humidity: <span class="humidity">--</span></span>
        </div>
        <div class="weather-details">
          <span>Sunrise: <span class="sunrise">--</span></span>
          <span>Sunset: <span class="sunset">--</span></span>
        </div>
      </div>
    </div>
  </div>
  <script src="js/search.js"></script>
</body>

</html>

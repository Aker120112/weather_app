<!-- New modern weather dashboard homepage layout -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="png" href="img/icon.png" />
  <link rel="stylesheet" href="css/new-style.css" />
  <title>Weather Dashboard</title>
</head>
<body>
  <div class="dashboard-container">
    <!-- Location, Date/Time, and Unit Toggle -->
    <div class="location-date">
      <div class="location">
        <i class="fa-solid fa-location-dot"></i>
        <span id="city">City Name</span>
      </div>
      <div class="datetime" id="datetime">Monday, 12:00 PM</div>
      <div class="unit-toggle">
        <button id="celsius-btn" class="unit-btn active">°C</button>
        <button id="fahrenheit-btn" class="unit-btn">°F</button>
      </div>
    </div>
    <!-- Current Weather Card -->
    <div class="current-weather-card">
      <div class="weather-main-info">
        <div id="main-weather-lottie" style="width:64px;height:64px;"></div>
        <div class="temperature" id="temperature">25°</div>
      </div>
      <div class="weather-description" id="weather-description">Clear Sky</div>
      <div class="weather-details">
        <span>Humidity: <span id="humidity">60%</span></span>
        <span>Wind: <span id="wind">10 km/h</span></span>
      </div>
    </div>
    <!-- Hourly Forecast -->
    <div class="forecast-section">
      <h3>Hourly Forecast</h3>
      <div class="hourly-forecast" id="hourly-forecast">
        <!-- JS will populate hourly forecast cards here -->
      </div>
    </div>
    <!-- Daily Forecast -->
    <div class="forecast-section">
      <h3>Daily Forecast</h3>
      <div class="daily-forecast" id="daily-forecast">
        <!-- JS will populate daily forecast cards here -->
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="js/new-main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>

</html>
